spring.application.name=medshare-backend

# HTTP port: defaults to 8080 (the port the frontend's local VITE_API_BASE_URL
# expects); override at deploy time via the PORT environment variable for
# platforms that assign ports dynamically.
server.port=${PORT:8080}

# CORS: comma-separated list of allowed frontend origins for /api/**.
# Defaults to the local Vite dev server; override at deploy time via the
# MEDSHARE_CORS_ALLOWED_ORIGINS environment variable (e.g. "https://app.example.com").
medshare.cors.allowed-origins=${MEDSHARE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
medshare.cors.allow-credentials=${MEDSHARE_CORS_ALLOW_CREDENTIALS:false}
